name: Tests
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
permissions:
  contents: read
env:
  NODE_VERSION: 24
  PNPM_VERSION: 10.30.3
jobs:
  # Skip the app jobs for pull requests that only change the website or docs
  # (see .github/workflows/website.yml). Skipped jobs count as passing for
  # required status checks; jobs that `need` a skipped job are skipped too.
  changes:
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Both paths of a renamed file: moving an app file into docs/ changes the app.
          files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')
          echo "$files"
          other=$(echo "$files" | grep -cvE '^(docs/|website/|\.github/workflows/website(-preview)?\.yml$)' || true)
          if [ "$other" -gt 0 ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  backend-lint:
    runs-on: ubuntu-22.04
    needs: changes
    if: needs.changes.outputs.app == 'true'
    steps:
      - if: github.event.pull_request.mergeable == 'false'
        name: Exit if PR is not mergeable
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install black==23.1.0 ruff==0.0.287
      - run: ruff check .
      - run: black --check .

  backend-unit-tests:
    runs-on: ubuntu-22.04
    needs: backend-lint
    env:
      COMPOSE_FILE: .ci/compose.ci.yaml
      COMPOSE_PROJECT_NAME: redash
      COMPOSE_DOCKER_CLI_BUILD: 1
      DOCKER_BUILDKIT: 1
    steps:
      - if: github.event.pull_request.mergeable == 'false'
        name: Exit if PR is not mergeable
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Build Docker Images
        run: |
          set -x
          docker compose build --build-arg install_groups="main,all_ds,dev" --build-arg skip_frontend_build=true
          docker compose up -d --wait postgres redis
      - name: Smoke Test Redash Image
        run: docker compose -p redash run --rm redash manage version
      - name: Create Test Database
        run: docker compose -p redash run --rm postgres psql -h postgres -U postgres -c "create database tests;"
      - name: List Enabled Query Runners
        run: docker compose -p redash run --rm redash manage ds list_types
      - name: Run Tests
        run: docker compose -p redash run --name tests redash tests --junitxml=junit.xml --cov-report=xml --cov=redash --cov-config=.coveragerc tests/
      - name: "Failure: output container logs"
        if: failure()
        run: docker compose logs
      - name: Copy Test Results
        run: |
          mkdir -p /tmp/test-results/unit-tests
          docker cp tests:/app/coverage.xml ./coverage.xml
          docker cp tests:/app/junit.xml /tmp/test-results/unit-tests/results.xml
      # - name: Upload coverage reports to Codecov
      #   uses: codecov/codecov-action@v3
      #   with:
      #     token: ${{ secrets.CODECOV_TOKEN }}
      - name: Store Test Results
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: /tmp/test-results
      - name: Store Coverage Results
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  frontend-lint:
    runs-on: ubuntu-22.04
    needs: changes
    if: needs.changes.outputs.app == 'true'
    steps:
      - if: github.event.pull_request.mergeable == 'false'
        name: Exit if PR is not mergeable
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Lint
        run: pnpm run lint:ci
      - name: Store Test Results
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: /tmp/test-results

  frontend-unit-tests:
    runs-on: ubuntu-22.04
    needs: frontend-lint
    steps:
      - if: github.event.pull_request.mergeable == 'false'
        name: Exit if PR is not mergeable
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Run App Tests
        run: pnpm run test
      - name: Run Visualizations Tests
        run: pnpm --filter @redash/viz test
      - run: pnpm run lint

  frontend-e2e-tests:
    runs-on: ubuntu-22.04
    needs: frontend-lint
    timeout-minutes: 60
    env:
      COMPOSE_FILE: .ci/compose.e2e.yaml
      COMPOSE_PROJECT_NAME: e2e
      # The MySQL driver, so the MySQL tests run instead of being skipped
      E2E_INSTALL_GROUPS: main,all_ds
    steps:
      - if: github.event.pull_request.mergeable == 'false'
        name: Exit if PR is not mergeable
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Setup Redash Server
        run: |
          set -x
          docker compose build server worker scheduler
          docker compose run --rm server create_db
          docker compose up -d
          timeout 120 sh -c 'until curl -sf http://localhost:5000/ping; do sleep 2; done'
          # The demo databases accept TCP connections once they have loaded their data
          timeout 180 sh -c 'until docker compose exec -T -e PGPASSWORD=demo e2e-postgres psql -h 127.0.0.1 -U demo -c "select 1 from events limit 1" demo; do sleep 2; done'
          timeout 180 sh -c 'until docker compose exec -T e2e-mysql mysql -h 127.0.0.1 -udemo -pdemo -e "select 1 from events limit 1" demo; do sleep 2; done'
      - name: Run End-to-End Tests
        run: pnpm run e2e
      - name: "Failure: output container logs to console"
        if: failure()
        run: docker compose logs
      - name: Store End-to-End Tests Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-tests-report
          path: client/e2e/.results
          include-hidden-files: true # .results is a hidden directory

  frontend-visual-tests:
    runs-on: ubuntu-22.04
    needs: frontend-lint
    env:
      COMPOSE_FILE: .ci/compose.visual-tests.yaml
      COMPOSE_PROJECT_NAME: visual-tests
      VISUAL_TESTS_BASE_URL: http://localhost:5000
      REDASH_FEATURE_ALLOW_CUSTOM_JS_VISUALIZATIONS: true
    steps:
      - if: github.event.pull_request.mergeable == 'false'
        name: Exit if PR is not mergeable
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Redash Server
        run: |
          set -x
          docker compose build server worker scheduler
          docker compose run --rm server create_db
          docker compose up -d server worker scheduler
          timeout 120 sh -c 'until curl -sf http://localhost:5000/ping; do sleep 2; done'
      - name: Run Visual Tests
        run: pnpm run visual-tests:docker
      - name: "Failure: output container logs to console"
        if: failure()
        run: docker compose logs
      - name: Store Visual Tests Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-tests-report
          path: client/visual-tests/.results
          include-hidden-files: true # .results is a hidden directory
