upstream redash_server {
    server server:5000;
}

upstream drill_api {
    server drill-api:9989;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # SkyNet drill-api: network layout, iSmart, incident handling, license, settings
    location ~ ^/(drill|drill_do|drill_static)(/|$) {
        proxy_pass http://drill_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else goes to the Redash app (Flask + built SPA)
    location / {
        proxy_pass http://redash_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
